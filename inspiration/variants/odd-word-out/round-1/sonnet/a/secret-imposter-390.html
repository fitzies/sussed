<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>Odd Word Out</title>
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--acc:#ff4a3d;--accRGB:255,74,61;--ink:#f6efe4;--mute:rgba(246,239,228,.62);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0a0908}
body{font-family:'Instrument Sans',sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:
 radial-gradient(110% 50% at 50% -6%, rgba(var(--accRGB),.34), transparent 62%),
 radial-gradient(70% 30% at 50% 108%, rgba(var(--accRGB),.14), transparent 70%),#0a0908}
.beams{position:absolute;inset:0;background:conic-gradient(from 148deg at 50% -3%, transparent 0deg, rgba(var(--accRGB),.20) 12deg, transparent 21deg, transparent 33deg, rgba(var(--accRGB),.12) 40deg, transparent 49deg, transparent 63deg);
 -webkit-mask-image:linear-gradient(#000 0,transparent 55%);mask-image:linear-gradient(#000 0,transparent 55%)}
.wrap{position:absolute;inset:0;padding:22px 20px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;height:34px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:600 14px 'Instrument Sans'}
.pill b{font:500 12px 'DM Mono';letter-spacing:.08em;color:var(--mute);font-weight:500;text-transform:uppercase}
.pips{display:flex;gap:4px}.pips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--acc);box-shadow:0 0 8px rgba(var(--accRGB),.8)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 34px rgba(0,0,0,.5)}
.mono{font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.btn{position:relative;flex:none;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px 'Unbounded';letter-spacing:-.01em;color:#1b1100;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff) 0,var(--acc) 48%,color-mix(in srgb,var(--acc) 82%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 1px rgba(var(--accRGB),.55),0 10px 36px rgba(var(--accRGB),.38);overflow:hidden}
.btn:after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0))}
.btn small{font:600 13px 'Instrument Sans';opacity:.7;letter-spacing:0}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px 'Unbounded';letter-spacing:-.03em;text-shadow:0 0 18px rgba(var(--accRGB),.7)}
.ring .t small{font:500 10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-shadow:none;margin-top:2px}
.av{display:block;flex:none}
</style></head>
<body><div class="stage"></div><div class="beams"></div><div class="wrap" >
  <div class="top"><div class="pill"><b>Round</b>3 of 5 <span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></div><div class="pill"><span class="hearts" style="display:inline-flex;gap:3px;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ff4a3daa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ff4a3d"/></svg><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ff4a3daa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ff4a3d"/></svg><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ff4a3daa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ff4a3d"/></svg></span></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:18px;align-items:center"><span class="mono">Your secret card</span><span class="mono" style="color:var(--ink)">Hides in 0:07</span></div>
  <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden"><i style="display:block;width:70%;height:100%;border-radius:2px;background:#ff4a3d;box-shadow:0 0 10px #ff4a3d"></i></div>
  <div class="glass" style="margin-top:16px;flex:1;position:relative;overflow:hidden;border-color:rgba(255,90,70,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 0 1px rgba(255,74,61,.22),0 18px 60px rgba(255,50,30,.3);display:flex;flex-direction:column;padding:22px">
    <div style="position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#ff4a3d 0 10px,#150504 10px 20px);opacity:.9"></div>
    <div style="position:absolute;left:-30%;right:-30%;top:-30%;height:80%;background:radial-gradient(closest-side,rgba(255,74,61,.32),transparent)"></div>
    <div style="position:relative;margin-top:10px;display:flex;align-items:center;gap:14px"><div style="width:58px;height:58px;border-radius:19px;background:rgba(255,74,61,.2);border:1px solid rgba(255,74,61,.6);display:flex;align-items:center;justify-content:center;box-shadow:0 0 28px rgba(255,74,61,.45)"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M12 2.5C6.8 2.5 3.5 4.6 3.5 8.6v3.2c0 5.2 3.2 9.7 8.5 9.7s8.5-4.5 8.5-9.7V8.6c0-4-3.3-6.1-8.5-6.1z" fill="#ff6a5c"/><path d="M6.5 9.6l4 1.6-.7 2.4-3.3-1.4zM17.5 9.6l-4 1.6.7 2.4 3.3-1.4z" fill="#2a0a07"/><path d="M9 17c1.8 1.2 4.2 1.2 6 0" stroke="#2a0a07" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
      <div style="font:800 28px 'Unbounded';letter-spacing:-.04em;line-height:1.05;color:#fff0ec;text-shadow:0 0 26px rgba(255,74,61,.7)">You're the<br>imposter</div></div>
    <div style="position:relative;margin-top:30px;display:flex;gap:10px;align-items:center"><span style="height:32px;padding:0 14px;border-radius:16px;background:rgba(255,74,61,.16);border:1px solid rgba(255,74,61,.5);display:inline-flex;align-items:center;font:600 15px 'Instrument Sans';color:#ffb3aa">Category: Places</span><span style="font:500 14px 'Instrument Sans';color:var(--mute)">No word for you</span></div>
    <div style="position:relative;margin-top:34px;border-radius:18px;padding:22px 20px;border:2px dashed rgba(255,110,95,.55);background:repeating-linear-gradient(-45deg,rgba(255,74,61,.10) 0 8px,rgba(255,74,61,0) 8px 16px)"><div class="mono" style="color:#ffb3aa">Your only hint</div><div style="font:800 46px 'Unbounded';letter-spacing:-.04em;margin-top:10px;color:#fff;text-shadow:0 0 30px rgba(255,74,61,.6)">It's tall.</div></div>
    <div style="position:relative;margin-top:auto;border-radius:18px;padding:16px 18px;background:rgba(0,0,0,.4);border:1px solid var(--line);display:flex;align-items:center;gap:14px">
      <div style="width:48px;height:48px;border-radius:15px;background:rgba(255,74,61,.16);display:flex;align-items:center;justify-content:center;flex:none"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#ff6a5c" stroke-width="2"/><circle cx="12" cy="12" r="4.5" fill="#ff6a5c"/></svg></div>
      <div><div style="font:500 15px 'Instrument Sans';color:var(--mute)">Give a clue about:</div><div style="font:700 30px 'Bricolage Grotesque';letter-spacing:-.02em;color:#ffb3aa;line-height:1.1">a colour</div></div></div>
  </div>
  <div style="margin-top:16px;display:flex;align-items:center;gap:14px;height:72px;border-radius:24px;padding:0 20px;background:linear-gradient(180deg,rgba(255,74,61,.24),rgba(255,74,61,.08));border:1px solid rgba(255,74,61,.65);box-shadow:0 0 0 6px rgba(255,74,61,.10),0 0 40px rgba(255,74,61,.3),inset 0 1px 0 rgba(255,255,255,.25)">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff6a5c" stroke-width="1.8" stroke-linecap="round"><path d="M5 10a7 7 0 0114 0"/><path d="M8 20c0-1.500.5-3 .5-5a3.500 3.500 0 017 0c0 3 0 5 1 7M12 20c0-2 .2-4 .2-5M5 14.500c0-1 0-2 .2-3M19 12c0 3-.2 5-1 7.500"/></svg><div style="flex:1"><div style="font:700 17px 'Unbounded';letter-spacing:-.01em">Holding to peek</div><div style="font:400 14px 'Instrument Sans';color:var(--mute)">Let go to hide your card</div></div></div></div></body></html>
