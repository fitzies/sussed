<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>Odd Word Out</title>
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--acc:#c9ff4f;--accRGB:201,255,79;--ink:#eef6ee;--mute:rgba(238,246,238,.62);--line:rgba(220,255,230,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#06100e}
body{font-family:'Space Grotesk',sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:
 radial-gradient(90% 38% at 50% 48%, rgba(var(--accRGB),.16), transparent 70%),
 radial-gradient(120% 40% at 50% 0%, rgba(40,120,90,.28), transparent 70%),#06100e}
.wrap{position:absolute;inset:0;padding:22px 20px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;height:34px;flex:none}
.logo{font:800 19px 'Bricolage Grotesque';letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:600 14px 'Space Grotesk'}
.chip.acc{border-color:rgba(var(--accRGB),.6);color:var(--acc);background:rgba(var(--accRGB),.10)}
.mono{font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.btn{flex:none;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 21px 'Bricolage Grotesque';letter-spacing:-.01em;color:#071006;background:var(--acc);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 0 0 5px rgba(var(--accRGB),.16),0 8px 40px rgba(var(--accRGB),.5)}
.btn small{font:500 13px 'DM Mono';letter-spacing:.06em;opacity:.7}
.av{display:block;flex:none}
</style></head>
<body><div class="stage"></div><div class="wrap">
  <div class="top"><span class="chip"><span class="mono" style="letter-spacing:.06em">Round</span>3 / 5</span><span class="chip" style="color:var(--mute)">Hides in <b style="color:var(--ink);font-family:'DM Mono';font-weight:500">0:07</b></span></div>
  <div style="flex:1;margin-top:14px;position:relative;border-radius:34px;background:linear-gradient(165deg,#e4ff8f 0%,#c9ff4f 40%,#a6e31c 100%);color:#071006;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 70px rgba(201,255,79,.38),0 30px 60px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;padding:22px">
  <svg width="342" height="400" style="position:absolute;right:0;top:0"><circle cx="310" cy="70" r="62" fill="none" stroke="#071006" stroke-opacity="0.138" stroke-width="2"/><circle cx="310" cy="70" r="124" fill="none" stroke="#071006" stroke-opacity="0.116" stroke-width="2"/><circle cx="310" cy="70" r="186" fill="none" stroke="#071006" stroke-opacity="0.094" stroke-width="2"/><circle cx="310" cy="70" r="248" fill="none" stroke="#071006" stroke-opacity="0.07200000000000001" stroke-width="2"/><circle cx="310" cy="70" r="310" fill="none" stroke="#071006" stroke-opacity="0.05000000000000002" stroke-width="2"/></svg>
  <div style="position:relative;display:flex;justify-content:space-between;align-items:center"><span style="height:36px;padding:0 16px;border-radius:18px;background:#071006;color:#c9ff4f;display:inline-flex;align-items:center;font:700 16px 'Space Grotesk'">Category: Places</span><span class="mono" style="color:#071006;opacity:.6">Secret card</span></div>
  <div style="position:relative;margin:auto 0"><div class="mono" style="color:#071006;opacity:.65">The secret word is</div>
    <div style="font:800 80px 'Bricolage Grotesque';letter-spacing:-.045em;line-height:.95;margin-top:10px;margin-left:-3px">Light-<br>house</div></div>
  <div style="position:relative;margin-top:auto;border-radius:24px;background:#071006;color:#eef6ee;padding:18px 20px;display:flex;align-items:center;gap:16px">
    <div style="width:56px;height:56px;border-radius:28px;background:#c9ff4f;display:flex;align-items:center;justify-content:center;flex:none"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#071006" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="#071006"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></div>
    <div><div style="font:500 15px 'Space Grotesk';opacity:.7">Give a clue about:</div><div style="font:800 36px 'Bricolage Grotesque';letter-spacing:-.03em;color:#c9ff4f;line-height:1.05">a sound</div></div></div></div>
  <div style="margin-top:14px;height:70px;border-radius:35px;display:flex;align-items:center;gap:14px;padding:0 24px 0 18px;background:rgba(201,255,79,.12);border:1.5px solid #c9ff4f;box-shadow:0 0 0 6px rgba(201,255,79,.12),0 0 30px rgba(201,255,79,.3)">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#c9ff4f" stroke-width="1.8" stroke-linecap="round"><path d="M5 10a7 7 0 0114 0"/><path d="M8 20c0-1.500.5-3 .5-5a3.500 3.500 0 017 0c0 3 0 5 1 7M12 20c0-2 .2-4 .2-5M5 14.500c0-1 0-2 .2-3M19 12c0 3-.2 5-1 7.500"/></svg><div style="flex:1"><div style="font:800 19px 'Bricolage Grotesque'">Holding to peek</div><div style="font:400 14px 'Space Grotesk';color:var(--mute)">Let go to hide</div></div></div></div></body></html>
