<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--paper:#F2ECE2;--ink:#1D1B18;--muted:#6F675C;--card:#FFFDF8;--line:rgba(29,27,24,.09);--teal:#17616A;--red:#DE3F2A;
--sh:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(60,40,20,.08),0 10px 22px -12px rgba(60,40,20,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Instrument Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:390px;height:844px;position:relative;overflow:hidden;padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;
background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.rnd{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}.rnd span{color:var(--muted);font-weight:500}
.clock{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:99px;background:#FBE3DC;color:#B42E1C;font-family:'DM Mono';font-weight:500;font-size:20px}
h1{margin:6px 4px 0;font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.sub{margin:0 4px;font-size:16px;color:var(--muted)}
.voted{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(29,27,24,.05)}
.voted b{font-size:16px}
.stack{display:flex;margin-left:auto}
.sa{width:30px;height:30px;border-radius:50%;margin-left:-7px;border:2.5px solid #EDE6DA;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:12px;color:#fff;position:relative}
.sa.wait{background:#DDD4C6!important;color:#9A9082}
.sa svg{position:absolute;right:-4px;bottom:-4px}
.list{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.c{height:74px;border-radius:18px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;padding:0 14px 0 12px;gap:12px;position:relative}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;color:#fff;box-shadow:0 -3px 0 rgba(0,0,0,.14) inset,0 2px 0 rgba(255,255,255,.35) inset}
.who b{font-size:18px;font-weight:600;display:block}
.who small{font-size:14px;color:var(--muted)}
.who small i{font-style:normal;font-family:'Fraunces';font-weight:600;color:var(--ink);font-size:16px}
.radio{margin-left:auto;width:30px;height:30px;border-radius:50%;border:2.5px solid #D5CBBB}
.c.sel{background:#1D1B18;color:#FFFDF8;transform:translateX(-6px) rotate(-1.4deg) scale(1.02);box-shadow:0 6px 0 #000,0 22px 30px -14px rgba(0,0,0,.55);z-index:2}
.c.sel small{color:rgba(255,253,248,.7)}.c.sel small i{color:#FFFDF8}
.stamp{margin-left:auto;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:10px;background:#F2B544;color:var(--ink);font-weight:700;font-size:15px;transform:rotate(3deg)}
.c.off{opacity:.55;box-shadow:none;background:rgba(255,253,248,.5)}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.go{height:64px;border-radius:20px;background:var(--red);color:#FFF6EC;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Bricolage Grotesque';font-size:21px;font-weight:700;box-shadow:0 5px 0 #9F2615,0 16px 24px -10px rgba(160,40,20,.5)}
.note{text-align:center;font-size:14px;color:var(--muted)}
</style></head><body>
<div class="screen">
  <div class="top"><div class="rnd">Round 3 <span>of 5 · Places</span></div>
    <div class="clock"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B42E1C" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>0:12</div></div>
  <h1>Who's the imposter?</h1>
  <div class="sub">Tap one player. Votes show when everyone's in.</div>
  <div class="voted"><b>4 of 6 voted</b>
    <div class="stack">
      <div class="sa" style="background:#6FA37C">G<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="#17616A"/><path d="M4 7.2l2 2 4-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
      <div class="sa" style="background:#4F82E0">D<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="#17616A"/><path d="M4 7.2l2 2 4-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
      <div class="sa" style="background:#E27C98">M<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="#17616A"/><path d="M4 7.2l2 2 4-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
      <div class="sa" style="background:#C06A3C">L<svg width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.5" fill="#17616A"/><path d="M4 7.2l2 2 4-4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div>
      <div class="sa wait">Y</div><div class="sa wait">M</div>
    </div></div>
  <div class="list">
    <div class="c"><div class="av" style="background:#6FA37C">G</div><div class="who"><b>Gran</b><small>said <i>Coast</i></small></div><div class="radio"></div></div>
    <div class="c sel"><div class="av" style="background:#4F82E0">D</div><div class="who"><b>Dad</b><small>said <i>White</i></small></div><div class="stamp"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1D1B18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Your pick</div></div>
    <div class="c"><div class="av" style="background:#E27C98">M</div><div class="who"><b>Mum</b><small>said <i>Safe</i></small></div><div class="radio"></div></div>
    <div class="c"><div class="av" style="background:#2FA3A0">M</div><div class="who"><b>Mia</b><small>said <i>Spinning</i></small></div><div class="radio"></div></div>
    <div class="c"><div class="av" style="background:#C06A3C">L</div><div class="who"><b>Leo</b><small>said <i>Sailors</i></small></div><div class="radio"></div></div>
  </div>
  <div class="foot">
    <div class="go"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF6EC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Lock vote for Dad</div>
    <div class="note">Wrong vote costs you 1 heart</div>
  </div>
</div>
</body></html>
