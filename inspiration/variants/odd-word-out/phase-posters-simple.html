:root{--ink:#111;--paper:#efede8;--muted:#5d5b56;--s:1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.top{max-width:1360px;margin:0 auto;padding:44px 28px 8px;display:grid;grid-template-columns:1fr auto;gap:12px 32px;align-items:end;border-bottom:2px solid var(--ink)}
.eyebrow{font:500 13px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
h1{font:800 clamp(40px,7vw,76px)/.92 'Unbounded',sans-serif;letter-spacing:-.035em;margin:0 0 18px}
.lede{max-width:52ch;margin:0 0 22px;color:var(--muted)}
.swatches{display:flex;gap:0;margin:0 0 22px;align-self:end}
.swatches span{width:34px;height:34px;display:block}
main{max-width:1360px;margin:0 auto;padding:28px 28px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(calc(390px * var(--s)),1fr));gap:44px 32px;justify-items:center}
.tile{margin:0;width:calc(390px * var(--s))}
figcaption{display:flex;gap:10px;align-items:baseline;margin:0 0 12px}
.num{font:500 13px 'DM Mono',monospace;letter-spacing:.06em}
.nm{font:700 17px 'Unbounded',sans-serif;letter-spacing:-.01em}
.nt{font-size:14px;color:var(--muted)}
.frame{width:calc(390px * var(--s));height:calc(844px * var(--s));overflow:hidden;outline:2px solid var(--ink)}
.screen{width:390px;height:844px;transform:scale(var(--s));transform-origin:0 0}
footer{max-width:1360px;margin:0 auto;padding:0 28px 48px;font:500 13px 'DM Mono',monospace;letter-spacing:.04em;color:var(--muted)}
@media (max-width:640px){.top{grid-template-columns:1fr;padding:28px 18px 4px} .swatches{margin-bottom:18px} main{padding:22px 18px 40px;gap:36px} footer{padding:0 18px 40px}}
