<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--paper:#F2ECE2;--ink:#1D1B18;--muted:#6F675C;--card:#FFFDF8;--teal:#17616A;--red:#DE3F2A}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Instrument Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:390px;height:844px;position:relative;overflow:hidden;padding:18px 20px 22px;display:flex;flex-direction:column;align-items:center;
background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;height:40px}
.rnd{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}.rnd span{color:var(--muted);font-weight:500}
.hearts{display:flex;gap:3px;padding:8px 10px;border-radius:99px;background:rgba(29,27,24,.06)}
.title{margin-top:18px;font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.deck{position:relative;width:318px;height:510px;margin-top:24px}
.back,.face{position:absolute;inset:0;border-radius:28px}
.back{background:#1D1B18;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.back:before{content:"";position:absolute;inset:10px;border-radius:20px;border:1.5px solid rgba(255,253,248,.18);
background:repeating-linear-gradient(45deg,rgba(255,253,248,.06) 0 6px,transparent 6px 12px)}
.b1{transform:rotate(5deg) translate(10px,10px)}.b2{transform:rotate(-4deg) translate(-8px,14px);background:#2A2723}
.face{background:linear-gradient(170deg,#FFFEFA,#F8F1E4);transform:rotate(-1.2deg) translateY(-14px);
box-shadow:0 1px 0 #fff inset,0 -2px 0 rgba(120,90,40,.08) inset,0 2px 3px rgba(60,40,20,.1),0 30px 50px -18px rgba(60,40,20,.45);padding:22px 24px;display:flex;flex-direction:column}
.face:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.cat{display:flex;justify-content:space-between;align-items:center}
.chip{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px;padding:8px 12px 8px 10px;border-radius:99px;background:#EAF2F0;color:var(--teal)}
.mark{font-family:'DM Mono';font-size:13px;color:var(--muted)}
.wl{margin-top:58px;text-align:center;font-size:16px;color:var(--muted);font-weight:500}
.word{margin-top:4px;text-align:center;font-family:'Fraunces',serif;font-weight:800;font-size:50px;letter-spacing:-.02em;line-height:1}
.dont{text-align:center;margin-top:10px;font-size:15px;color:var(--muted)}
.perf{margin:auto -24px 0;height:0;border-top:2px dashed rgba(29,27,24,.16);position:relative}
.perf:before,.perf:after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:#EDE5D8}
.perf:before{left:-11px}.perf:after{right:-11px}
.angle{padding-top:18px;display:flex;align-items:center;gap:14px}
.ai{width:58px;height:58px;border-radius:18px;background:var(--teal);display:grid;place-items:center;box-shadow:0 -3px 0 rgba(0,0,0,.2) inset}
.angle small{display:block;font-size:15px;color:var(--muted);font-weight:500}
.angle b{font-family:'Bricolage Grotesque';font-size:28px;font-weight:800;letter-spacing:-.01em}
.peek{margin-top:auto;display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px 10px 10px;border-radius:24px;background:var(--card);box-shadow:0 1px 0 #fff inset,0 10px 24px -12px rgba(60,40,20,.3)}
.pad{width:64px;height:64px;position:relative;flex:none}
.pad .in{position:absolute;inset:7px;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 2px 0 #000 inset}
.peek b{font-size:17px;display:block}.peek span{font-size:15px;color:var(--muted)}
.secs{margin-left:auto;font-family:'DM Mono';font-size:20px;font-weight:500}

.face.imp{background:linear-gradient(165deg,#E8482F,#C9301E);color:#FFF6EC;box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 -2px 0 rgba(0,0,0,.15) inset,0 2px 3px rgba(80,20,10,.2),0 30px 50px -18px rgba(120,30,10,.55)}
.face.imp:before{content:"";position:absolute;inset:0;border-radius:28px;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.07) 0 10px,transparent 10px 20px);pointer-events:none}
.face.imp > *{position:relative;z-index:1}
.imp .chip{background:rgba(0,0,0,.22);color:#FFF6EC}.imp .mark{color:rgba(255,246,236,.75)}
.you{margin-top:40px;font-family:'Bricolage Grotesque';font-weight:800;font-size:46px;line-height:.95;letter-spacing:-.03em}
.mask{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:16px;font-weight:500;color:rgba(255,246,236,.85)}
.hint{margin-top:26px;background:#1D1B18;border-radius:18px;padding:14px 16px;box-shadow:0 -2px 0 rgba(255,255,255,.08) inset}
.hint small{font-size:14px;color:rgba(255,246,236,.65);font-weight:500}
.hint div{font-family:'Fraunces',serif;font-style:italic;font-weight:400;font-size:30px;margin-top:2px}
.imp .perf{border-top-color:rgba(0,0,0,.25)}
.imp .ai{background:#1D1B18}.imp .angle small{color:rgba(255,246,236,.75)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.4-4.5-9.5-9.1C1 8.5 3.1 4.6 6.8 4.6c2 0 3.5 1.1 4.3 2.5l.9 1.4.9-1.4c.8-1.4 2.3-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.4 16.5 12 21 12 21z"/></symbol>
</defs></svg>
<div class="screen">
  <div class="top"><div class="rnd">Round 3 <span>of 5</span></div>
    <div class="hearts"><svg width="20" height="20" fill="#DE3F2A"><use href="#h"/></svg><svg width="20" height="20" fill="#DE3F2A"><use href="#h"/></svg><svg width="20" height="20" fill="none" stroke="#B5AB9C" stroke-width="2"><use href="#h"/></svg></div></div>
  <div class="title">Your card</div>
  <div class="deck">
    <div class="back b2"></div><div class="back b1"></div>
    <div class="face imp">
      <div class="cat"><div class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFF6EC" stroke-width="2.2" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Places</div><div class="mark">3 / 5</div></div>
      <div class="you">You're the imposter</div>
      <div class="mask"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF6EC" stroke-width="2" stroke-linecap="round"><path d="M3 9c0-2 4-3 9-3s9 1 9 3c0 4-2 8-5 8-2 0-2.5-2-4-2s-2 2-4 2c-3 0-5-4-5-8z"/><path d="M7.5 10.5h2.5M14 10.5h2.5"/></svg>No word for you. Blend in.</div>
      <div class="hint"><small>Your hint</small><div>"It's tall."</div></div>
      <div class="perf"></div>
      <div class="angle"><div class="ai"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFF6EC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.4 0 2-1 1.5-2.2-.6-1.4.3-2.8 1.8-2.8H18a3 3 0 0 0 3-3c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2" fill="#FFF6EC"/><circle cx="10" cy="7" r="1.2" fill="#FFF6EC"/><circle cx="15" cy="7.5" r="1.2" fill="#FFF6EC"/></svg></div>
        <div><small>Give a clue about</small><b>a colour</b></div></div>
    </div>
  </div>
  <div class="peek">
    <div class="pad"><svg width="64" height="64" viewBox="0 0 64 64" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="32" cy="32" r="29" fill="none" stroke="#E7DFD2" stroke-width="5"/><circle cx="32" cy="32" r="29" fill="none" stroke="#DE3F2A" stroke-width="5" stroke-linecap="round" stroke-dasharray="182" stroke-dashoffset="55"/></svg>
      <div class="in"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="1.8" stroke-linecap="round"><path d="M8 20c-1.5-2-2-4-2-7a6 6 0 0 1 12 0"/><path d="M10.5 20c-.8-2-1.2-4-1.2-6.5a2.7 2.7 0 0 1 5.4 0c0 2 .3 3.5 1 5"/><path d="M12 14c0 2.5.5 4.5 1.5 6.5"/></svg></div></div>
    <div><b>Holding to peek</b><span>Let go to hide your card</span></div>
    <div class="secs">0:07</div>
  </div>
</div>
</body></html>
