<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>Odd Word Out</title>
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--acc:#ffb830;--accRGB:255,184,48;--ink:#f6efe4;--mute:rgba(246,239,228,.62);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0a0908}
body{font-family:'Instrument Sans',sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:
 radial-gradient(110% 50% at 50% -6%, rgba(var(--accRGB),.34), transparent 62%),
 radial-gradient(70% 30% at 50% 108%, rgba(var(--accRGB),.14), transparent 70%),#0a0908}
.beams{position:absolute;inset:0;background:conic-gradient(from 148deg at 50% -3%, transparent 0deg, rgba(var(--accRGB),.20) 12deg, transparent 21deg, transparent 33deg, rgba(var(--accRGB),.12) 40deg, transparent 49deg, transparent 63deg);
 -webkit-mask-image:linear-gradient(#000 0,transparent 55%);mask-image:linear-gradient(#000 0,transparent 55%)}
.wrap{position:absolute;inset:0;padding:22px 20px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;height:34px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:600 14px 'Instrument Sans'}
.pill b{font:500 12px 'DM Mono';letter-spacing:.08em;color:var(--mute);font-weight:500;text-transform:uppercase}
.pips{display:flex;gap:4px}.pips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--acc);box-shadow:0 0 8px rgba(var(--accRGB),.8)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 34px rgba(0,0,0,.5)}
.mono{font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.btn{position:relative;flex:none;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px 'Unbounded';letter-spacing:-.01em;color:#1b1100;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff) 0,var(--acc) 48%,color-mix(in srgb,var(--acc) 82%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 1px rgba(var(--accRGB),.55),0 10px 36px rgba(var(--accRGB),.38);overflow:hidden}
.btn:after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0))}
.btn small{font:600 13px 'Instrument Sans';opacity:.7;letter-spacing:0}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px 'Unbounded';letter-spacing:-.03em;text-shadow:0 0 18px rgba(var(--accRGB),.7)}
.ring .t small{font:500 10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-shadow:none;margin-top:2px}
.av{display:block;flex:none}
</style></head>
<body><div class="stage"></div><div class="beams"></div><div class="wrap" >
  <div class="top"><div class="pill"><b>Round</b>3 of 5 <span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></span></div><div class="pill"><span class="hearts" style="display:inline-flex;gap:3px;align-items:center"><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ffb830aa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ffb830"/></svg><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ffb830aa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ffb830"/></svg><svg width="16" height="16" viewBox="0 0 24 24" style="filter:drop-shadow(0 0 5px #ffb830aa)"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3 1.7-1.9 3.4-3 5.4-3 3.6 0 5.7 3.9 4.2 7.3C19.5 16.4 12 21 12 21z" fill="#ffb830"/></svg></span></div></div>
  <div style="display:flex;justify-content:space-between;margin-top:18px;align-items:center"><span class="mono">Your secret card</span><span class="mono" style="color:var(--ink)">Hides in 0:07</span></div>
  <div style="height:4px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden"><i style="display:block;width:70%;height:100%;border-radius:2px;background:#ffb830;box-shadow:0 0 10px #ffb830"></i></div>
  <div class="glass" style="margin-top:16px;flex:1;position:relative;overflow:hidden;border-color:rgba(255,200,90,.42);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 0 1px rgba(255,184,48,.18),0 18px 60px rgba(255,150,20,.25);display:flex;flex-direction:column;padding:22px 22px 22px">
    <div style="position:absolute;left:-30%;right:-30%;top:-30%;height:80%;background:radial-gradient(closest-side,rgba(255,200,90,.30),transparent)"></div>
    <div style="position:relative;display:flex;justify-content:space-between;align-items:center"><span style="height:32px;padding:0 14px;border-radius:16px;background:rgba(255,184,48,.16);border:1px solid rgba(255,184,48,.5);display:inline-flex;align-items:center;font:600 15px 'Instrument Sans';color:#ffd98a">Category: Places</span></div>
    <div style="position:relative;margin:auto 0;text-align:center"><div class="mono">The secret word is</div>
      <div style="font:800 42px 'Unbounded';letter-spacing:-.04em;margin-top:18px;color:#fff3d6;text-shadow:0 0 34px rgba(255,184,48,.75),0 2px 0 rgba(0,0,0,.4)">Lighthouse</div></div>
    <div style="position:relative;margin-top:auto;border-radius:18px;padding:16px 18px;background:rgba(0,0,0,.38);border:1px solid var(--line);display:flex;align-items:center;gap:14px">
      <div style="width:48px;height:48px;border-radius:15px;background:rgba(255,184,48,.16);display:flex;align-items:center;justify-content:center;flex:none"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffb830" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="#ffb830"/><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"/></svg></div>
      <div><div style="font:500 15px 'Instrument Sans';color:var(--mute)">Give a clue about:</div><div style="font:700 30px 'Bricolage Grotesque';letter-spacing:-.02em;color:#ffd98a;line-height:1.1">a sound</div></div></div>
  </div>
  <div style="margin-top:16px;display:flex;align-items:center;gap:14px;height:72px;border-radius:24px;padding:0 20px;background:linear-gradient(180deg,rgba(255,184,48,.22),rgba(255,184,48,.08));border:1px solid rgba(255,184,48,.6);box-shadow:0 0 0 6px rgba(255,184,48,.10),0 0 40px rgba(255,184,48,.3),inset 0 1px 0 rgba(255,255,255,.3)">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffb830" stroke-width="1.8" stroke-linecap="round"><path d="M5 10a7 7 0 0114 0"/><path d="M8 20c0-1.500.5-3 .5-5a3.500 3.500 0 017 0c0 3 0 5 1 7M12 20c0-2 .2-4 .2-5M5 14.500c0-1 0-2 .2-3M19 12c0 3-.2 5-1 7.500"/></svg><div style="flex:1"><div style="font:700 17px 'Unbounded';letter-spacing:-.01em">Holding to peek</div><div style="font:400 14px 'Instrument Sans';color:var(--mute)">Let go to hide your card</div></div></div></div></body></html>
