<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>Odd Word Out</title>
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--acc:#ffb830;--accRGB:255,184,48;--ink:#f6efe4;--mute:rgba(246,239,228,.62);--line:rgba(255,255,255,.11)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#0a0908}
body{font-family:'Instrument Sans',sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:
 radial-gradient(110% 50% at 50% -6%, rgba(var(--accRGB),.34), transparent 62%),
 radial-gradient(70% 30% at 50% 108%, rgba(var(--accRGB),.14), transparent 70%),#0a0908}
.beams{position:absolute;inset:0;background:conic-gradient(from 148deg at 50% -3%, transparent 0deg, rgba(var(--accRGB),.20) 12deg, transparent 21deg, transparent 33deg, rgba(var(--accRGB),.12) 40deg, transparent 49deg, transparent 63deg);
 -webkit-mask-image:linear-gradient(#000 0,transparent 55%);mask-image:linear-gradient(#000 0,transparent 55%)}
.wrap{position:absolute;inset:0;padding:22px 20px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;height:34px;flex:none}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);font:600 14px 'Instrument Sans'}
.pill b{font:500 12px 'DM Mono';letter-spacing:.08em;color:var(--mute);font-weight:500;text-transform:uppercase}
.pips{display:flex;gap:4px}.pips i{width:14px;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}.pips i.on{background:var(--acc);box-shadow:0 0 8px rgba(var(--accRGB),.8)}
.glass{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 14px 34px rgba(0,0,0,.5)}
.mono{font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.btn{position:relative;flex:none;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:10px;font:700 17px 'Unbounded';letter-spacing:-.01em;color:#1b1100;
 background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 70%,#fff) 0,var(--acc) 48%,color-mix(in srgb,var(--acc) 82%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 1px rgba(var(--accRGB),.55),0 10px 36px rgba(var(--accRGB),.38);overflow:hidden}
.btn:after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0))}
.btn small{font:600 13px 'Instrument Sans';opacity:.7;letter-spacing:0}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 30px 'Unbounded';letter-spacing:-.03em;text-shadow:0 0 18px rgba(var(--accRGB),.7)}
.ring .t small{font:500 10px 'DM Mono';letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-shadow:none;margin-top:2px}
.av{display:block;flex:none}
</style></head>
<body><div class="stage"></div><div class="beams"></div><div class="wrap" >
  <div class="top"><div style="display:flex;align-items:center;gap:9px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#ffb830"><circle cx="12" cy="10" r="6.500"/><rect x="9" y="17" width="6" height="4" rx="1.500"/></svg><span style="font:700 14px 'Unbounded';letter-spacing:-.01em">Odd Word Out</span></div><div class="pill" style="color:#ffb830"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ffb830"><path d="M3 19L2 7l5.5 4.5L12 4l4.5 7.500L22 7l-1 12z"/></svg>Host</div></div>
  <div style="margin-top:30px;text-align:center"><div class="mono">Join at <span style="color:var(--ink)">oddwordout.app</span> with the room code</div>
   <div style="display:flex;justify-content:center;gap:10px;margin-top:16px"><div style="width:76px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 50px 'Unbounded';color:#ffe3a3;text-shadow:0 0 22px rgba(255,184,48,.9),0 0 3px #fff6;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%,rgba(255,184,48,.10));border:1px solid rgba(255,214,140,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(255,184,48,.18)">M</div><div style="width:76px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 50px 'Unbounded';color:#ffe3a3;text-shadow:0 0 22px rgba(255,184,48,.9),0 0 3px #fff6;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%,rgba(255,184,48,.10));border:1px solid rgba(255,214,140,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(255,184,48,.18)">O</div><div style="width:76px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 50px 'Unbounded';color:#ffe3a3;text-shadow:0 0 22px rgba(255,184,48,.9),0 0 3px #fff6;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%,rgba(255,184,48,.10));border:1px solid rgba(255,214,140,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(255,184,48,.18)">T</div><div style="width:76px;height:92px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:800 50px 'Unbounded';color:#ffe3a3;text-shadow:0 0 22px rgba(255,184,48,.9),0 0 3px #fff6;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.02) 55%,rgba(255,184,48,.10));border:1px solid rgba(255,214,140,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(0,0,0,.5),0 0 28px rgba(255,184,48,.18)">H</div></div></div>
  <div style="margin-top:30px"><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="mono">In the room</span><span class="mono" style="color:var(--ink)">6 of 10</span></div>
   <div style="display:flex;justify-content:space-between"><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#ffb23e;"><g fill="#ffb23e"><circle cx="20" cy="20" r="19"/></g><text x="20" y="26" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="#0c0a08">Y</text></svg><span style="position:absolute;right:-5px;top:-7px;width:22px;height:22px;border-radius:11px;background:#1b1100;border:1.5px solid #ffb830;display:flex;align-items:center;justify-content:center"><svg width="12" height="12" viewBox="0 0 24 24" fill="#ffb830"><path d="M3 19L2 7l5.5 4.5L12 4l4.5 7.500L22 7l-1 12z"/></svg></span></div><span style="font:600 14px 'Instrument Sans'">You</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#5fd0bd;"><g fill="#5fd0bd"><rect x="1" y="1" width="38" height="38" rx="13"/></g><text x="20" y="26" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="#0c0a08">G</text></svg></div><span style="font:600 14px 'Instrument Sans'">Gran</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#ff7d5c;"><g fill="#ff7d5c"><polygon points="20,1 37,10.5 37,29.5 20,39 3,29.5 3,10.5" stroke-linejoin="round" stroke="currentColor" stroke-width="3"/></g><text x="20" y="26" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="#0c0a08">D</text></svg></div><span style="font:600 14px 'Instrument Sans'">Dad</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#f08fc0;"><g fill="#f08fc0"><polygon points="20,1 39,20 20,39 1,20" stroke-linejoin="round" stroke="currentColor" stroke-width="5"/></g><text x="20" y="25.5" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="14" fill="#0c0a08">Mu</text></svg></div><span style="font:600 14px 'Instrument Sans'">Mum</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#7fb2ff;"><g fill="#7fb2ff"><polygon points="12,1 28,1 39,12 39,28 28,39 12,39 1,28 1,12" stroke-linejoin="round" stroke="currentColor" stroke-width="2"/></g><text x="20" y="25.5" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="14" fill="#0c0a08">Mi</text></svg></div><span style="font:600 14px 'Instrument Sans'">Mia</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:54px"><div style="position:relative"><svg class="av" width="48" height="48" viewBox="0 0 40 40" style="color:#b6e24f;"><g fill="#b6e24f"><rect x="1" y="5" width="38" height="30" rx="15"/></g><text x="20" y="26" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="18" fill="#0c0a08">L</text></svg></div><span style="font:600 14px 'Instrument Sans'">Leo</span></div></div></div>
  <div style="margin-top:28px"><div class="mono" style="margin-bottom:10px">Roles</div><div class="glass" style="padding:3px 0"><div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 12px 0 10px">
   <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,184,48,.18)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffb830" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="12" r="2.6" fill="#ffb830"/><path d="M13 7.5a6 6 0 010 9M17 4.5a10.5 10.5 0 010 15" /></svg></div>
   <div style="flex:1;min-width:0"><div style="font:600 17px 'Instrument Sans'">Echo</div><div style="font:400 13px 'Instrument Sans';color:var(--mute)">Sees a nearby word</div></div>
   <div style="width:52px;height:30px;border-radius:15px;padding:3px;background:linear-gradient(180deg,#ffd37a,#ffb830);box-shadow:0 0 16px rgba(255,184,48,.55),inset 0 1px 0 #fff8;display:flex;justify-content:flex-end"><i style="width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.4)"></i></div></div><div style="height:1px;background:var(--line);margin:0 12px"></div><div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 12px 0 10px">
   <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="rgba(246,239,228,.55)"><path d="M3 17c0-5 1.5-9 2.5-12 1.5 2 3 3 4.5 4 .8-2 1.2-4 2-6 .8 2 1.2 4 2 6 1.500-1 3-2 4.500-4C19.500 8 21 12 21 17z"/><rect x="3" y="18.2" width="18" height="2.6" rx="1.3"/></svg></div>
   <div style="flex:1;min-width:0"><div style="font:600 17px 'Instrument Sans'">Jester</div><div style="font:400 13px 'Instrument Sans';color:var(--mute)">Wants to be voted out</div></div>
   <div style="width:52px;height:30px;border-radius:15px;padding:3px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);display:flex;justify-content:flex-start"><i style="width:24px;height:24px;border-radius:12px;background:#8d867c;box-shadow:0 2px 4px rgba(0,0,0,.4)"></i></div></div><div style="height:1px;background:var(--line);margin:0 12px"></div><div style="display:flex;align-items:center;gap:12px;height:58px;padding:0 12px 0 10px">
   <div style="width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(246,239,228,.55)" stroke-width="2.2" stroke-linecap="round"><circle cx="10" cy="10" r="6"/><path d="M14.5 14.5L20.5 20.5"/></svg></div>
   <div style="flex:1;min-width:0"><div style="font:600 17px 'Instrument Sans'">Detective</div><div style="font:400 13px 'Instrument Sans';color:var(--mute)">Learns one innocent</div></div>
   <div style="width:52px;height:30px;border-radius:15px;padding:3px;background:rgba(255,255,255,.12);box-shadow:inset 0 1px 3px rgba(0,0,0,.5);display:flex;justify-content:flex-start"><i style="width:24px;height:24px;border-radius:12px;background:#8d867c;box-shadow:0 2px 4px rgba(0,0,0,.4)"></i></div></div></div></div>
  <div style="display:flex;gap:12px;margin-top:14px"><div class="glass" style="flex:1;height:84px;padding:10px 12px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between"><div class="mono">Hearts</div><div style="display:flex;align-items:center;justify-content:space-between"><span style="width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6efe4" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></span><span style="font:800 28px 'Unbounded';letter-spacing:-.03em">3</span><span style="width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6efe4" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div></div><div class="glass" style="flex:1;height:84px;padding:10px 12px;border-radius:20px;display:flex;flex-direction:column;justify-content:space-between"><div class="mono">Rounds</div><div style="display:flex;align-items:center;justify-content:space-between"><span style="width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6efe4" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg></span><span style="font:800 28px 'Unbounded';letter-spacing:-.03em">5</span><span style="width:34px;height:34px;border-radius:17px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f6efe4" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div></div></div>
  <div style="display:flex;gap:8px;margin-top:16px;align-items:center"><span style="height:32px;padding:0 13px;border-radius:16px;display:inline-flex;align-items:center;font:600 14px 'Instrument Sans';background:rgba(255,184,48,.16);border:1px solid rgba(255,184,48,.55);color:#ffd98a">Places</span><span style="height:32px;padding:0 13px;border-radius:16px;display:inline-flex;align-items:center;font:600 14px 'Instrument Sans';background:rgba(255,184,48,.16);border:1px solid rgba(255,184,48,.55);color:#ffd98a">Food</span><span style="height:32px;padding:0 13px;border-radius:16px;display:inline-flex;align-items:center;font:600 14px 'Instrument Sans';background:rgba(255,184,48,.16);border:1px solid rgba(255,184,48,.55);color:#ffd98a">Animals</span><span style="height:32px;padding:0 13px;border-radius:16px;display:inline-flex;align-items:center;font:600 14px 'Instrument Sans';background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--mute)">+3 packs</span></div>
  <div class="btn" style="margin-top:auto">Start round</div></div></body></html>
