<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--paper:#F2ECE2;--ink:#1D1B18;--muted:#6F675C;--card:#FFFDF8;--line:rgba(29,27,24,.09);--teal:#17616A;--red:#DE3F2A;
--sh:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(60,40,20,.08),0 10px 22px -12px rgba(60,40,20,.25)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Instrument Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:390px;height:844px;position:relative;overflow:hidden;padding:18px 20px 22px;display:flex;flex-direction:column;gap:12px;
background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.rnd{font-family:'Bricolage Grotesque';font-weight:700;font-size:18px}.rnd span{color:var(--muted);font-weight:500}
.mini{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px 0 6px;border-radius:12px;background:var(--card);box-shadow:var(--sh);font-size:14px;font-weight:600;transform:rotate(1.5deg)}
.mini i{width:22px;height:28px;border-radius:5px;background:var(--ink);display:block;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 3px,transparent 3px 6px)}
.timer{display:flex;align-items:center;gap:16px;padding:14px 18px;border-radius:22px;background:var(--ink);color:#FFFDF8;box-shadow:0 5px 0 #000,0 14px 24px -12px rgba(0,0,0,.5)}
.timer .t{font-family:'DM Mono';font-weight:500;font-size:44px;letter-spacing:-.02em;line-height:1}
.timer b{font-family:'Bricolage Grotesque';font-size:20px;display:block}
.timer span{font-size:15px;color:rgba(255,253,248,.65)}
.ring{margin-left:auto}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px -2px}
.sec h2{margin:0;font-family:'Bricolage Grotesque';font-size:19px;font-weight:700}.sec span{font-size:14px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:7px}
.c{height:76px;border-radius:18px;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;padding:0 16px 0 12px;gap:12px}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;color:#fff;box-shadow:0 -3px 0 rgba(0,0,0,.14) inset,0 2px 0 rgba(255,255,255,.35) inset}
.who{min-width:0}
.who b{font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}
.hs{display:inline-flex;gap:1px}
.who small{font-size:14px;color:var(--muted);display:block;margin-top:2px}
.clue{margin-left:auto;font-family:'Fraunces',serif;font-weight:600;font-size:27px;letter-spacing:-.01em}
.c.me{box-shadow:0 0 0 2px var(--ink) inset,var(--sh)}
.foot{margin-top:auto;display:flex;gap:10px}
.btn{flex:1;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:700;font-size:19px;background:var(--card);box-shadow:0 4px 0 #DCCFBB,0 10px 18px -10px rgba(60,40,20,.3)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.4-4.5-9.5-9.1C1 8.5 3.1 4.6 6.8 4.6c2 0 3.5 1.1 4.3 2.5l.9 1.4.9-1.4c.8-1.4 2.3-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.4 16.5 12 21 12 21z"/></symbol>
</defs></svg>
<div class="screen">
  <div class="top"><div class="rnd">Round 3 <span>of 5 · Places</span></div>
    <div class="mini"><i></i>Hold to peek</div></div>
  <div class="timer">
    <div class="t">0:48</div>
    <div><b>Talk it out</b><span>Who doesn't know the word?</span></div>
    <svg class="ring" width="44" height="44" viewBox="0 0 44 44" style="transform:rotate(-90deg)"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,253,248,.15)" stroke-width="5"/><circle cx="22" cy="22" r="18" fill="none" stroke="#F2B544" stroke-width="5" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="53"/></svg>
  </div>
  <div class="sec"><h2>All 6 clues are in</h2><span>Angle under each name</span></div>
  <div class="list">
    <div class="c me"><div class="av" style="background:#E89A2C">Y</div><div class="who"><b>You <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg></span></b><small>a sound</small></div><div class="clue">Foghorn</div></div>
    <div class="c"><div class="av" style="background:#6FA37C">G</div><div class="who"><b>Gran <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="none" stroke="#C2B8A8" stroke-width="2.4"><use href="#h"/></svg></span></b><small>a place</small></div><div class="clue">Coast</div></div>
    <div class="c"><div class="av" style="background:#4F82E0">D</div><div class="who"><b>Dad <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="none" stroke="#C2B8A8" stroke-width="2.4"><use href="#h"/></svg></span></b><small>a colour</small></div><div class="clue">White</div></div>
    <div class="c"><div class="av" style="background:#E27C98">M</div><div class="who"><b>Mum <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg></span></b><small>a feeling</small></div><div class="clue">Safe</div></div>
    <div class="c"><div class="av" style="background:#2FA3A0">M</div><div class="who"><b>Mia <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="none" stroke="#C2B8A8" stroke-width="2.4"><use href="#h"/></svg><svg width="14" height="14" fill="none" stroke="#C2B8A8" stroke-width="2.4"><use href="#h"/></svg></span></b><small>how it moves</small></div><div class="clue">Spinning</div></div>
    <div class="c"><div class="av" style="background:#C06A3C">L</div><div class="who"><b>Leo <span class="hs"><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="#DE3F2A"><use href="#h"/></svg><svg width="14" height="14" fill="none" stroke="#C2B8A8" stroke-width="2.4"><use href="#h"/></svg></span></b><small>who uses it</small></div><div class="clue">Sailors</div></div>
  </div>
  <div class="foot"><div class="btn">Ready to vote</div></div>
</div>
</body></html>
