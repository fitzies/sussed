<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390, initial-scale=1">
<title>Odd Word Out</title>
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--acc:#ff3d8d;--accRGB:255,61,141;--ink:#eef6ee;--mute:rgba(238,246,238,.62);--line:rgba(220,255,230,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#06100e}
body{font-family:'Space Grotesk',sans-serif;color:var(--ink);position:relative;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;background:
 radial-gradient(90% 38% at 50% 48%, rgba(var(--accRGB),.16), transparent 70%),
 radial-gradient(120% 40% at 50% 0%, rgba(40,120,90,.28), transparent 70%),#06100e}
.wrap{position:absolute;inset:0;padding:22px 20px 22px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;height:34px;flex:none}
.logo{font:800 19px 'Bricolage Grotesque';letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font:600 14px 'Space Grotesk'}
.chip.acc{border-color:rgba(var(--accRGB),.6);color:var(--acc);background:rgba(var(--accRGB),.10)}
.mono{font:500 12px 'DM Mono';letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.btn{flex:none;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 21px 'Bricolage Grotesque';letter-spacing:-.01em;color:#071006;background:var(--acc);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 0 0 5px rgba(var(--accRGB),.16),0 8px 40px rgba(var(--accRGB),.5)}
.btn small{font:500 13px 'DM Mono';letter-spacing:.06em;opacity:.7}
.av{display:block;flex:none}
</style></head>
<body><div class="stage"></div><div class="wrap">
  <div class="top"><span class="chip"><span class="mono" style="letter-spacing:.06em">Round</span>3 / 5</span><span class="chip" style="color:var(--mute)">Hides in <b style="color:var(--ink);font-family:'DM Mono';font-weight:500">0:07</b></span></div>
  <div style="flex:1;margin-top:14px;position:relative;border-radius:34px;background:linear-gradient(165deg,#ff8cc0 0%,#ff3d8d 45%,#e0126e 100%);color:#14020a;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 70px rgba(255,61,141,.38),0 30px 60px rgba(0,0,0,.5);overflow:hidden;display:flex;flex-direction:column;padding:22px">
  <div style="position:absolute;left:-40px;right:-40px;top:80px;height:18px;transform:rotate(-4deg);background:repeating-linear-gradient(90deg,#14020a 0 22px,transparent 22px 44px);opacity:.92"></div>
  <div style="position:relative;display:flex;justify-content:space-between;align-items:center"><span style="height:36px;padding:0 16px;border-radius:18px;background:#14020a;color:#ff8cc0;display:inline-flex;align-items:center;font:700 16px 'Space Grotesk'">Category: Places</span><span class="mono" style="color:#14020a;opacity:.65">Secret card</span></div>
  <div style="position:relative;margin-top:70px;display:flex;align-items:center;gap:14px"><div style="width:62px;height:62px;border-radius:31px;background:#14020a;display:flex;align-items:center;justify-content:center;flex:none"><svg width="38" height="38" viewBox="0 0 24 24"><path d="M12 2.5C6.8 2.5 3.5 4.6 3.5 8.6v3.2c0 5.2 3.2 9.7 8.5 9.7s8.5-4.5 8.5-9.7V8.6c0-4-3.3-6.1-8.5-6.1z" fill="#ff5aa5"/><path d="M6.5 9.6l4 1.6-.7 2.4-3.3-1.4zM17.5 9.6l-4 1.6.7 2.4 3.3-1.4z" fill="#14020a"/><path d="M9 17c1.8 1.2 4.2 1.2 6 0" stroke="#14020a" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg></div></div>
  <div style="position:relative;font:800 56px 'Bricolage Grotesque';letter-spacing:-.045em;line-height:.95;margin-top:14px;margin-left:-2px">You're the<br>imposter</div>
  <div style="position:relative;margin-top:16px;border-radius:20px;border:2.5px dashed rgba(20,2,10,.6);padding:12px 16px;display:flex;justify-content:space-between;align-items:center"><span style="font:600 15px 'Space Grotesk'">The word</span><span style="font:800 28px 'Bricolage Grotesque';letter-spacing:.2em">?????</span></div>
  <div style="position:relative;margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <div style="border-radius:22px;background:#fff;color:#14020a;padding:12px 18px;display:flex;justify-content:space-between;align-items:center"><span class="mono" style="color:#14020a;opacity:.65">Your hint</span><span style="font:800 32px 'Bricolage Grotesque';letter-spacing:-.03em">It's tall</span></div>
    <div style="border-radius:22px;background:#14020a;color:#eef6ee;padding:14px 18px;display:flex;align-items:center;gap:14px">
      <div style="width:46px;height:46px;border-radius:23px;background:#ff5aa5;display:flex;align-items:center;justify-content:center;flex:none"><svg width="26" height="26" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#14020a" stroke-width="2.4"/><circle cx="12" cy="12" r="4" fill="#14020a"/></svg></div>
      <div><div style="font:500 14px 'Space Grotesk';opacity:.7">Give a clue about:</div><div style="font:800 30px 'Bricolage Grotesque';letter-spacing:-.03em;color:#ff8cc0;line-height:1.05">a colour</div></div></div></div></div>
  <div style="margin-top:14px;height:70px;border-radius:35px;display:flex;align-items:center;gap:14px;padding:0 24px 0 18px;background:rgba(255,61,141,.12);border:1.5px solid #ff3d8d;box-shadow:0 0 0 6px rgba(255,61,141,.12),0 0 30px rgba(255,61,141,.3)">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ff3d8d" stroke-width="1.8" stroke-linecap="round"><path d="M5 10a7 7 0 0114 0"/><path d="M8 20c0-1.500.5-3 .5-5a3.500 3.500 0 017 0c0 3 0 5 1 7M12 20c0-2 .2-4 .2-5M5 14.500c0-1 0-2 .2-3M19 12c0 3-.2 5-1 7.500"/></svg><div style="flex:1"><div style="font:800 19px 'Bricolage Grotesque'">Holding to peek</div><div style="font:400 14px 'Space Grotesk';color:var(--mute)">Let go to hide</div></div></div></div></body></html>
