<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="../../../prep/fonts.css">
<style>
:root{--paper:#F2ECE2;--ink:#1D1B18;--muted:#6F675C;--card:#FFFDF8;--line:rgba(29,27,24,.09);--teal:#17616A;--red:#DE3F2A;
--sh:0 1px 0 rgba(255,255,255,.9) inset,0 1px 2px rgba(60,40,20,.08),0 10px 24px -10px rgba(60,40,20,.22)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Instrument Sans',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.screen{width:390px;height:844px;position:relative;overflow:hidden;padding:18px 20px 22px;display:flex;flex-direction:column;gap:14px;
background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .1 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque';font-weight:800;font-size:21px;letter-spacing:-.02em}
.pill{font-size:14px;font-weight:600;padding:7px 12px;border-radius:99px;background:rgba(29,27,24,.06);color:var(--muted)}
.card{background:var(--card);border-radius:22px;box-shadow:var(--sh)}
.code{padding:16px 16px 14px;position:relative}
.lab{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles{display:flex;gap:8px;margin-top:10px}
.tile{width:56px;height:66px;border-radius:12px;background:linear-gradient(#FFF8EA,#F4E9D4);display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:36px;
box-shadow:0 1px 0 #fff inset,0 -3px 0 rgba(120,90,40,.12) inset,0 4px 0 #D9C9AA,0 8px 14px -6px rgba(80,50,20,.35)}
.tile:nth-child(odd){transform:rotate(-2deg)}.tile:nth-child(2){transform:rotate(1.5deg) translateY(-1px)}
.share{position:absolute;right:16px;top:40px;width:52px;height:52px;border-radius:16px;background:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 #000,0 10px 16px -8px rgba(0,0,0,.5)}
.join{margin-top:14px;font-size:16px;color:var(--muted)}.join b{color:var(--ink);font-weight:600}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:2px 4px -4px}
.sec h2{margin:0;font-family:'Bricolage Grotesque';font-size:19px;font-weight:700}
.sec span{font-size:14px;color:var(--muted)}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:16px;background:var(--card);box-shadow:var(--sh);height:52px}
.pl b{font-size:16px;font-weight:600}
.av{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;color:#fff;position:relative;
box-shadow:0 -3px 0 rgba(0,0,0,.14) inset,0 2px 0 rgba(255,255,255,.35) inset}
.crown{position:absolute;top:-7px;right:-5px}
.settings{padding:6px 16px 14px}
.row{display:flex;align-items:center;justify-content:space-between;height:58px;border-bottom:1px solid var(--line)}
.row .k{font-size:17px;font-weight:600}.row .k small{display:block;font-size:13px;font-weight:500;color:var(--muted)}
.step{display:flex;align-items:center;gap:6px}
.sb{width:44px;height:44px;border-radius:14px;background:#F3EDE2;display:grid;place-items:center;box-shadow:0 2px 0 #E0D5C2;font-size:22px;color:var(--muted)}
.sv{min-width:56px;text-align:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;display:flex;gap:2px;justify-content:center}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.role{border-radius:16px;padding:10px 10px 10px;background:#F6F1E8;box-shadow:0 2px 0 #E3D9C8;display:flex;flex-direction:column;gap:6px;height:104px}
.role.on{background:#E3F0EE;box-shadow:0 2px 0 #B7D3CF, 0 0 0 2px var(--teal) inset}
.role b{font-size:15px}.role small{font-size:13px;color:var(--muted);line-height:1.15}
.sw{width:40px;height:24px;border-radius:99px;background:#D8CFC0;position:relative;margin-top:auto}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.on .sw{background:var(--teal)}.on .sw:after{left:19px}
.rh{display:flex;justify-content:space-between;align-items:center}
.packs{display:flex;gap:6px;margin-top:12px;flex-wrap:nowrap;overflow:hidden}
.pk{font-size:14px;font-weight:600;padding:7px 10px;border-radius:10px;background:#F3EDE2;color:var(--muted);white-space:nowrap}
.pk.sel{background:var(--ink);color:#FFFDF8}
.go{margin-top:auto;height:64px;border-radius:20px;background:var(--ink);color:#FFFDF8;display:flex;align-items:center;justify-content:center;gap:10px;font-family:'Bricolage Grotesque';font-size:21px;font-weight:700;
box-shadow:0 5px 0 #000,0 16px 24px -10px rgba(0,0,0,.45)}
.hint{text-align:center;font-size:14px;color:var(--muted);margin-top:-4px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.4-4.5-9.5-9.1C1 8.5 3.1 4.6 6.8 4.6c2 0 3.5 1.1 4.3 2.5l.9 1.4.9-1.4c.8-1.4 2.3-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.4 16.5 12 21 12 21z"/></symbol>
</defs></svg>
<div class="screen">
  <div class="top">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 30 30"><rect x="9" y="3" width="17" height="23" rx="4" fill="#DE3F2A" transform="rotate(12 17 14)"/><rect x="4" y="4" width="17" height="23" rx="4" fill="#FFFDF8" stroke="#1D1B18" stroke-width="2"/><circle cx="12.5" cy="15.5" r="3" fill="#1D1B18"/></svg>Odd Word Out</div>
    <div class="pill">You're the host</div>
  </div>

  <div class="card code">
    <div class="lab">Room code</div>
    <div class="tiles"><div class="tile">M</div><div class="tile">O</div><div class="tile">T</div><div class="tile">H</div></div>
    <div class="share" aria-label="Share invite"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></div>
    <div class="join">Join at <b>oddwordout.app</b></div>
  </div>

  <div class="sec"><h2>Players</h2><span>6 joined · up to 10</span></div>
  <div class="players">
    <div class="pl"><div class="av" style="background:#E89A2C">Y<svg class="crown" width="18" height="14" viewBox="0 0 18 14"><path d="M1 12 2 3l4 4 3-6 3 6 4-4 1 9z" fill="#1D1B18" stroke="#FFFDF8" stroke-width="1.5" stroke-linejoin="round"/></svg></div><b>You</b></div>
    <div class="pl"><div class="av" style="background:#6FA37C">G</div><b>Gran</b></div>
    <div class="pl"><div class="av" style="background:#4F82E0">D</div><b>Dad</b></div>
    <div class="pl"><div class="av" style="background:#E27C98">M</div><b>Mum</b></div>
    <div class="pl"><div class="av" style="background:#2FA3A0">M</div><b>Mia</b></div>
    <div class="pl"><div class="av" style="background:#C06A3C">L</div><b>Leo</b></div>
  </div>

  <div class="card settings">
    <div class="row"><div class="k">Hearts each</div>
      <div class="step"><div class="sb">−</div><div class="sv"><svg width="20" height="20" fill="#DE3F2A"><use href="#h"/></svg><svg width="20" height="20" fill="#DE3F2A"><use href="#h"/></svg><svg width="20" height="20" fill="#DE3F2A"><use href="#h"/></svg></div><div class="sb">+</div></div></div>
    <div class="row"><div class="k">Rounds</div>
      <div class="step"><div class="sb">−</div><div class="sv">5</div><div class="sb">+</div></div></div>
    <div class="row" style="border:0;height:50px"><div class="k">Imposters</div>
      <div class="step"><div class="sb">−</div><div class="sv">1</div><div class="sb">+</div></div></div>
    <div class="roles">
      <div class="role on"><div class="rh"><b>Echo</b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17616A" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg></div><small>Gets a nearby word</small><div class="sw"></div></div>
      <div class="role"><div class="rh"><b>Jester</b><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#6F675C" stroke-width="2.2" stroke-linejoin="round"><path d="M4 18 3 7l5 4 4-7 4 7 5-4-1 11z"/></svg></div><small>Wants your votes</small><div class="sw"></div></div>
      <div class="role"><div class="rh"><b>Detective</b><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6F675C" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></div><small>Knows one innocent</small><div class="sw"></div></div>
    </div>
    <div class="packs"><span class="pk sel">Places</span><span class="pk sel">Food</span><span class="pk sel">Animals</span><span class="pk">+3 more</span></div>
  </div>

  <div class="go">Start round<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
</div>
</body></html>
